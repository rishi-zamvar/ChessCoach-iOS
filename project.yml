name: ChessCoach
options:
  bundleIdPrefix: com.rishizamvar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ChessCoachKit:
    path: Packages/ChessCoachKit
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "373D7DZ9NM"
targets:
  ChessCoach:
    type: application
    platform: iOS
    sources:
      # Engines/ (nnue + maia .pb.gz) and Sounds/ (*.wav) land as individual
      # files in the bundle root: Bundle.main.url(forResource:withExtension:).
      - path: ChessCoach
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
    entitlements:
      path: ChessCoach/ChessCoach.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: ChessCoach/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Plain HTTP to the home PC over the Tailscale tunnel (100.x); everything else stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: ChessCoach
        # The public server: Cloudflare Tunnel to the home PC (only the isolated public service).
        PublicServerURL: "https://chess.zamvar.io"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ChessCoach talks to your home PC over Tailscale for deep analysis and to receive its AI key.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.chesscoach
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: ChessCoachKit
        product: ChessCoachKit
  ChessCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChessCoachTests
    dependencies:
      - target: ChessCoach
  ChessCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ChessCoachUITests
    dependencies:
      - target: ChessCoach
schemes:
  ChessCoach:
    build:
      targets:
        ChessCoach: all
        ChessCoachTests: [test]
        ChessCoachUITests: [test]
    test:
      targets:
        - ChessCoachTests
        - ChessCoachUITests
